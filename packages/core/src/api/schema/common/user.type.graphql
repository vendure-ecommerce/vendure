type User implements Node {
    id: ID!
    createdAt: DateTime!
    updatedAt: DateTime!
    identifier: String!
    verified: Boolean!
    roles: [Role!]!
    "User-level Channels. If there are any, they replace the Channels of the user's Roles"
    channels: [Channel!]!
    lastLogin: DateTime
    authenticationMethods: [AuthenticationMethod!]!
}

type AuthenticationMethod implements Node {
    id: ID!
    createdAt: DateTime!
    updatedAt: DateTime!
    strategy: String!
}
